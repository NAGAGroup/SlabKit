[workspace]
authors = ["Jack Myers <jack@myersjack.dev>"]
channels = ["https://prefix.dev/code-accelerate", "conda-forge"]
name = "slabkit"
platforms = ["linux-64"]
version = "0.1.0"
preview = ["pixi-build"]



[feature.opencl.dependencies]
intel-opencl-rt = ">=2025.2.0,<2026"

[feature.level-zero.dependencies]
level-zero = ">=1.28.2,<2"

[feature.cuda.dependencies]
cuda-nvvm = ">=12.6,<12.7"
cuda-runtime = ">=12.6,<12.7"

[feature.amd.dependencies]
hip-runtime-amd = ">=6,<7"
rocm-device-libs = ">=6,<7"

[dependencies]
slabkit = { path = "." }

# Consumer envs per backend; `all` carries every runtime.
[environments.default]
features = []
solve-group = "default"

[environments.cuda]
features = ["cuda"]
solve-group = "default"

[environments.l0]
features = ["level-zero"]
solve-group = "default"

[environments.ocl]
features = ["opencl"]
solve-group = "default"

[environments.amd]
features = ["amd"]
solve-group = "default"

[environments.all]
features = ["cuda", "level-zero", "opencl", "amd"]
solve-group = "default"

# ------------------------------------------------------------------------------
# pixi-build package definition: allows other pixi workspaces to consume
# slabkit as a source dependency, e.g. `slabkit = { path = "../slabkit" }`.
# ------------------------------------------------------------------------------
[package]
name = "slabkit"
version = "0.1.0"

[package.build.backend]
name = "pixi-build-cmake"
version = "0.*"
channels = ["https://prefix.dev/pixi-build-backends", "https://prefix.dev/conda-forge"]

[package.build-dependencies]
acpp-toolchain = ">=20.1.8_acpp25.10.0,<21"
cmake = ">=3.28,<4"
ninja = ">=1.12"

[package.build.config]
# Header-only package: tests (which need the SYCL toolchain) stay off.
extra-args = ["-DSLABKIT_BUILD_TESTS=OFF"]
# Header-only: no translation units include these headers during the package
# build, so the backend's ninja-based input tracking misses them. Without this
# glob, edits to headers do NOT invalidate pixi's build cache.
extra-input-globs = ["include/**/*.hpp"]

# ------------------------------------------------------------------------------
# DEV: package dep closure (toolchain) + dev tools/tasks. Hardware-flavored
# variants; dev-omp = CPU-only via acpp's built-in OpenMP host backend.
# ------------------------------------------------------------------------------
[feature.dev.dev]
slabkit = { path = "." }

[feature.dev.dependencies]
nushell = ">=0.110.0,<0.111"
catch2 = ">=3.8"

[feature.dev.tasks]
configure = "nu scripts/configure.nu dev"
build = { cmd = "nu scripts/build.nu dev", depends-on = ["configure"] }
test = { cmd = "nu scripts/test.nu dev", depends-on = ["build"] }

[environments.dev]
features = ["cuda", "dev"]
solve-group = "default"
no-default-feature = true

[environments.dev-cuda]
features = ["cuda", "dev"]
solve-group = "default"
no-default-feature = true

[environments.dev-l0]
features = ["level-zero", "dev"]
solve-group = "default"
no-default-feature = true

[environments.dev-ocl]
features = ["opencl", "dev"]
solve-group = "default"
no-default-feature = true

[environments.dev-amd]
features = ["amd", "dev"]
solve-group = "default"
no-default-feature = true

[environments.dev-omp]
features = ["dev"]
solve-group = "default"
no-default-feature = true
