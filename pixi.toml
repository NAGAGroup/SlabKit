[workspace]
authors = ["Jack Myers <jack@myersjack.dev>"]
channels = ["https://prefix.dev/jackm97/naga-labs"]
name = "slabkit"
platforms = ["linux-64"]
version = "0.1.0"
preview = ["pixi-build"]

# Compiler selection (post-migration): variant stems, resolved by the backend
# as <stem>_<target_platform> activation packages from the naga-labs channel.
# Never name an activation package in a dep table; never add *_compiler_version.
[workspace.build-variants]
c_compiler = ["acpp-clang"]
cxx_compiler = ["acpp-clangxx"]

[feature.opencl.dependencies]
intel-opencl-rt = ">=2025.2.0,<2026"

[feature.level-zero.dependencies]
level-zero = ">=1.28.2,<2"

[feature.cuda.dependencies]
cuda-nvvm = ">=12.6,<12.7"
cuda-runtime = ">=12.6,<12.7"

[feature.amd.dependencies]
hip-runtime-amd = ">=6,<7"
rocm-device-libs = ">=6,<7"

[dependencies]
slabkit = { path = "." }

# Consumer envs per backend (implicit default env = bare package);
# `all` carries every runtime.
[environments.cuda]
features = ["cuda"]
solve-group = "default"

[environments.l0]
features = ["level-zero"]
solve-group = "default"

[environments.ocl]
features = ["opencl"]
solve-group = "default"

[environments.amd]
features = ["amd"]
solve-group = "default"

[environments.all]
features = ["cuda", "level-zero", "opencl", "amd"]
solve-group = "default"

# ------------------------------------------------------------------------------
# pixi-build package definition: allows other pixi workspaces to consume
# slabkit as a source dependency, e.g. `slabkit = { path = "../slabkit" }`.
# ------------------------------------------------------------------------------
[package]
name = "slabkit"
version = "0.1.0"

[package.build.backend]
name = "pixi-build-cmake"
version = "==0.4.5"
channels = ["https://prefix.dev/pixi-build-backends", "https://prefix.dev/conda-forge"]

[package.build-dependencies]
cmake = ">=3.28,<4"
ninja = ">=1.12"

# SYCL headers + lib/cmake/AdaptiveCpp. The runtime arrives via run-export;
# consumers must NOT write acpp-runtime or acpp-llvm themselves.
[package.host-dependencies]
acpp = ">=25.10.0,<25.11.0a0"

[package.build.config]
# Header-only package: tests (which need the SYCL toolchain) stay off.
extra-args = ["-DSLABKIT_BUILD_TESTS=OFF"]
# Header-only: no translation units include these headers during the package
# build, so the backend's ninja-based input tracking misses them. Without this
# glob, edits to headers do NOT invalidate pixi's build cache.
extra-input-globs = ["include/**/*.hpp"]

# ------------------------------------------------------------------------------
# DEV: package dep closure (toolchain) + dev tools/tasks. Hardware-flavored
# variants; dev-omp = CPU-only via acpp's built-in OpenMP host backend.
# A dev env drives CMake directly (no backend), so it names the compiler
# activation package explicitly — the one place that is correct.
# ------------------------------------------------------------------------------
[feature.dev.dev]
slabkit = { path = "." }

[feature.dev.dependencies]
nushell = ">=0.110.0,<0.111"
catch2 = ">=3.8"
acpp = ">=25.10.0,<25.11.0a0"
acpp-tools = ">=25.10.0,<25.11.0a0"

[feature.dev.target.linux-64.dependencies]
acpp-clangxx_linux-64 = ">=25.10.0,<25.11.0a0"
acpp-clang_linux-64 = ">=25.10.0,<25.11.0a0"

[feature.dev.tasks]
configure = "nu scripts/configure.nu dev"
build = { cmd = "nu scripts/build.nu dev", depends-on = ["configure"] }
test = { cmd = "nu scripts/test.nu dev", depends-on = ["build"] }

[environments.dev]
features = ["cuda", "dev"]
solve-group = "default"
no-default-feature = true

[environments.dev-cuda]
features = ["cuda", "dev"]
solve-group = "default"
no-default-feature = true

[environments.dev-l0]
features = ["level-zero", "dev"]
solve-group = "default"
no-default-feature = true

[environments.dev-ocl]
features = ["opencl", "dev"]
solve-group = "default"
no-default-feature = true

[environments.dev-amd]
features = ["amd", "dev"]
solve-group = "default"
no-default-feature = true

[environments.dev-omp]
features = ["dev"]
solve-group = "default"
no-default-feature = true
